<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नई रचना — Omveer Ki Kalam</title><link rel="stylesheet" href="index.html"></head><body style="font-family:Arial,sans-serif;background:#fffaf3;padding:30px"><div style="max-width:700px;margin:auto"><h1>नई रचना जोड़ें ✍</h1><p>यह शुरुआती डेमो पोस्ट को इसी ब्राउज़र में सेव करता है।</p><input id="title" placeholder="शीर्षक" style="width:100%;padding:12px;margin:8px 0"><select id="cat" style="width:100%;padding:12px;margin:8px 0"><option>कहानी</option><option>विचार</option><option>कविता</option></select><textarea id="text" rows="10" placeholder="अपनी रचना लिखें..." style="width:100%;padding:12px;margin:8px 0"></textarea><button onclick="save()" style="padding:12px 20px">प्रकाशित करें</button> <a href="index.html">वेबसाइट देखें</a><p id="msg"></p></div><script>function save(){let t=title.value.trim(),x=text.value.trim();if(!t||!x)return alert('शीर्षक और रचना भरें');let p=JSON.parse(localStorage.getItem('omveerPosts')||'null')||[];p.unshift({title:t,cat:cat.value,text:x,date:new Date().toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric'})});localStorage.setItem('omveerPosts',JSON.stringify(p));msg.textContent='रचना सेव हो गई। अब वेबसाइट देखें।';title.value='';text.value=''}</script></body></html>
